[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-hour-visual-hotkey-editor"
version = "0.1.0"
description = "Visual hotkey editor for Command & Conquer: Generals — Zero Hour"
requires-python = ">=3.12"
dependencies = ["PySide6==6.8.3", "Pillow>=10.4"]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pyinstaller>=6.10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
